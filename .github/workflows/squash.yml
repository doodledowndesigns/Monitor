name: One-off history squash

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hansard
  cancel-in-progress: false

jobs:
  squash:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Replace history with a single commit of the current files
        run: |
          git config user.name "hansard-bot"
          git config user.email "hansard-bot@users.noreply.github.com"
          git checkout --orphan fresh
          git add -A
          git commit -q -m "Education Monitor data feed"
          git push --force origin fresh:main
